[project]
name = "gdrive-reader-auth"
version = "0.1.0"
description = "OAuth broker (Cloudflare Python Worker) for the gdrive-reader Claude Code plugin."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # fake credentials in tests
