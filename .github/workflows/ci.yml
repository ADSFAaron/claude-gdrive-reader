name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Plugin
        working-directory: plugin
        run: uv run --frozen ruff check . && uv run --frozen pytest -q
      - name: Backend
        working-directory: backend
        run: uv run --frozen ruff check . && uv run --frozen pytest -q
